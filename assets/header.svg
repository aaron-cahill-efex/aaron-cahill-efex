<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="PS&gt; whoami. Aaron Cahill, Information Security Operations Lead at efex. PS&gt; Get-Motto. Trust, but log everything.">
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, Menlo, monospace; }
    .prompt { fill: #00E5FF; font-size: 18px; font-weight: 700; }
    .cmd    { fill: #C8D3F5; font-size: 18px; }
    .name   { fill: #00FF9C; font-size: 32px; font-weight: 700; }
    .role   { fill: #C8D3F5; font-size: 17px; }
    .motto  { fill: #FF2FD0; font-size: 18px; font-weight: 700; }
    .chrome { fill: #5A6378; font-size: 13px; }

    .cover  { fill: #0B0E14; }
    .type1  { animation: type1 .6s steps(6) .4s forwards; }
    .type2  { animation: type2 .8s steps(9) 1.9s forwards; }
    .fade   { opacity: 0; animation: fade .5s ease-out forwards; }
    .f1 { animation-delay: 1.1s; }
    .f2 { animation-delay: 1.35s; }
    .f3 { animation-delay: 2.9s; }
    .cursor { opacity: 0; animation: blink 1.1s step-end 3.2s infinite; }

    @keyframes type1 { to { transform: translateX(80px); } }
    @keyframes type2 { to { transform: translateX(120px); } }
    @keyframes fade  { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cover { display: none; }
      .fade, .cursor { opacity: 1; animation: none; }
    }
  </style>

  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="838" height="238" rx="12" fill="#0B0E14" stroke="#00E5FF" stroke-opacity=".35" stroke-width="1.5"/>
  <line x1="1" y1="38" x2="839" y2="38" stroke="#00E5FF" stroke-opacity=".15"/>
  <circle cx="24" cy="19" r="6" fill="#FF2FD0"/>
  <circle cx="46" cy="19" r="6" fill="#FFD000"/>
  <circle cx="68" cy="19" r="6" fill="#00FF9C"/>
  <text x="420" y="24" text-anchor="middle" class="chrome">pwsh — aaron@efex: ~</text>

  <!-- PS> whoami -->
  <text x="28" y="76" class="prompt">PS&gt;</text>
  <text x="74" y="76" class="cmd">whoami</text>
  <rect x="72" y="58" width="80" height="26" class="cover type1"/>

  <text x="28" y="120" class="name fade f1" filter="url(#glow)">Aaron Cahill</text>
  <text x="28" y="148" class="role fade f2">Information Security Operations Lead · efex</text>

  <!-- PS> Get-Motto -->
  <text x="28" y="188" class="prompt">PS&gt;</text>
  <text x="74" y="188" class="cmd">Get-Motto</text>
  <rect x="72" y="170" width="120" height="26" class="cover type2"/>

  <text x="28" y="218" class="motto fade f3" filter="url(#glow)">Trust, but log everything.</text>
  <rect x="318" y="203" width="10" height="19" fill="#00E5FF" class="cursor"/>
</svg>
